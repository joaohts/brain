# brain configuration. install.sh copies this to config.toml (git-ignored);
# edit config.toml, never this file. Secrets (OPENAI_API_KEY) go in .env.
# Relative paths are relative to the repo root; ~ is expanded.
# Check it with: .venv/bin/python -m brain.config

[agent]
assistant_name = "Assistant"        # what the agent calls itself
owner_name = "Owner"                # the person it works for (tier "owner")
language = "English"                # default reply language (identity_file can override)
timezone = "UTC"                    # IANA name: calendar, clock, budget days/weeks
identity_file = "data/identity.md"  # system prompt / persona (install.sh seeds it)
memory_dir = "data/memory"          # *.md files loaded as durable memory
db_path = "data/brain.db"           # traces, threads, timers

[model]
name = "gpt-6-luna"                 # OpenAI Responses API model
price_in_per_mtok = 0.10            # USD per 1M input tokens (cost tracking)
price_out_per_mtok = 0.50           # USD per 1M output tokens
reasoning_effort = "medium"         # none / low / medium / high, every model call
daily_budget_usd = 1.0              # hold new turns past this spend per day; 0 = no cap
weekly_budget_usd = 0.0             # same per week (Monday 00:00); 0 = no cap
                                    # days and weeks follow [agent] timezone
budget_alert_channel = ""           # 80%/100% alerts; "" = owner's WhatsApp contact
budget_cli_max_daily_usd = 0.0      # highest temporary cap brain-budget (agent CLI)
budget_cli_max_weekly_usd = 0.0     # may set; 0 = the CLI can't raise the caps

[limits]
max_tool_steps = 6
window_turns = 20
auto_compact_turns = 40
blackboard_hours = 4
blackboard_max_lines = 12

[server]
host = "127.0.0.1"                  # keep it on localhost: /turn has no auth
port = 3401

[messages]                          # fixed replies sent without a model call;
                                    # write them in [agent] language
budget_reached = "I've reached my {period} spending limit (US$ {limit}). Your messages are saved and I'll answer them when it resets ({resets}). {owner} can raise it for now with \"budget today N\" or \"budget week N\"."
out_of_steps = "I ran out of steps before finishing this: {request}"
failure = "Something failed on my side before I could answer: {request}"

# ---- optional integrations: all off by default -----------------------------

[whatsapp]                          # wa/ sidecar (Baileys), service brain-wa
enabled = false
port = 3402                         # sidecar's local /send endpoint
contacts_file = "wa/allow.json"     # allowlist + contact book (copy allow.example.json)
auth_dir = "wa/auth"                # Baileys session; created on first QR scan
transcribe_model = "whisper-1"      # voice notes -> text
vision_model = "gpt-5-mini"         # images / PDFs -> text (in [agent] language)
transcribe_language = ""            # ISO-639-1 hint for voice notes, e.g. "en"; "" = auto
owner_channel = "cli"               # where "WhatsApp logged out" notices go: "cli" or a
                                    # comms-v1:<machine>:<agent> channel (needs [comms])

[comms]                             # comms node channel (brain/comms_v1.py)
enabled = false
socket = "~/.local/share/comms/node.sock"
alias = "brain"                     # persistent comms identity
trusted_machines = []               # machine IDs whose agents get tier "owner"
state_path = "data/comms-v1/adapter.db"

[calendar]                          # calendar_* tools via an external script
enabled = false
script = ""                         # executable implementing the contract in README

[claude_sessions]                   # claude_spawn/list/kill tools (needs comms, tmux, claude)
enabled = false
script = "scripts/claude-sessions.sh"
source = "brain"                    # session-name prefix
idle_minutes = 480                  # a worker inactive this long (no pane output, report
                                    # or follow-up) is killed, [FINAL] or not; 0 = kill
                                    # at [FINAL] (480 still applies to the rest)
reap_scope = "brain"                # whose idle Claude sessions are ended: "brain" (ours),
                                    # "managed" (any claude-sessions.sh one), "all" (every
                                    # claude process; others get SIGTERM, terminal kept)
state_dir = "~/.local/state/claude-sessions"   # activity logs written by
                                    # scripts/claude-activity-hook.sh (install it!)

[vault]                             # vault_* tools: owner-only notes folder access
enabled = false
path = ""                           # e.g. "~/notes"; the tools never run git
read_only = []                      # folder prefixes readable but never written
deny = []                           # vault-relative globs never read or written,
                                    # e.g. ["private/secrets.md", "**/secrets.md"]
max_note_bytes = 1000000            # larger notes are refused
max_read_chars = 20000              # per vault_read call; page with offset
max_write_bytes = 200000            # largest note a write may produce
max_results = 50                    # list entries / search hits per call
search_seconds = 5
